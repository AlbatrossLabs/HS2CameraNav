<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a38"/>
      <stop offset="1" stop-color="#1d1540"/>
    </linearGradient>
    <radialGradient id="glow" cx="930" cy="430" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b7cff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#7a4dff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7a4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="0" y="300" width="1280" height="340" fill="url(#gridFade)"/>
    </mask>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40c9ff"/>
      <stop offset="1" stop-color="#b56bff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d4ff"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3360"/>
      <stop offset="1" stop-color="#1a2145"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b56bff"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#40c9ff"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- perspective grid floor, vanishing point (930, 250) -->
  <g mask="url(#gridMask)" stroke="#6f86ff" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M930,250 L330,640 M930,250 L450,640 M930,250 L570,640 M930,250 L690,640 M930,250 L810,640 M930,250 L930,640 M930,250 L1050,640 M930,250 L1170,640 M930,250 L1290,640 M930,250 L1410,640 M930,250 L1530,640 M930,250 L210,640 M930,250 L90,640"/>
    <path d="M400,330 H1280 M330,350 H1280 M250,378 H1280 M160,414 H1280 M60,462 H1280 M0,526 H1280 M0,610 H1280"/>
  </g>

  <!-- orbit ring around the pivot -->
  <ellipse cx="930" cy="430" rx="250" ry="74" fill="none" stroke="url(#ring)" stroke-width="3" stroke-opacity="0.9"/>
  <path d="M700,400 A250,74 0 0 1 820,364" fill="none" stroke="#b56bff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1160,460 A250,74 0 0 1 1040,496" fill="none" stroke="#40c9ff" stroke-width="3" marker-end="url(#arrowC)"/>

  <!-- pivot gizmo -->
  <g stroke-linecap="round" stroke-width="5">
    <line x1="930" y1="430" x2="1015" y2="452" stroke="#ff5a6e"/>
    <line x1="930" y1="430" x2="930" y2="330" stroke="#5be38a"/>
    <line x1="930" y1="430" x2="862" y2="466" stroke="#4d9bff"/>
  </g>
  <circle cx="1015" cy="452" r="7" fill="#ff5a6e"/>
  <circle cx="930" cy="330" r="7" fill="#5be38a"/>
  <circle cx="862" cy="466" r="7" fill="#4d9bff"/>
  <circle cx="930" cy="430" r="11" fill="#ffffff"/>
  <circle cx="930" cy="430" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- camera on the ring, looking at the pivot -->
  <g stroke="#40c9ff" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="6 6" fill="none">
    <line x1="1060" y1="362" x2="944" y2="416"/>
    <line x1="1078" y1="388" x2="946" y2="438"/>
  </g>
  <path d="M1060,362 L944,416 L946,438 L1078,388 Z" fill="#40c9ff" fill-opacity="0.08"/>
  <g transform="translate(1110,360) rotate(-24)">
    <rect x="-34" y="-24" width="68" height="48" rx="10" fill="#ffffff"/>
    <rect x="-54" y="-14" width="24" height="28" rx="4" fill="#d8e0ff"/>
    <circle cx="6" cy="0" r="14" fill="#1a2145"/>
    <circle cx="6" cy="0" r="7" fill="#40c9ff"/>
    <rect x="12" y="-34" width="16" height="10" rx="3" fill="#ffffff"/>
  </g>

  <!-- title block -->
  <g font-family="Inter, 'Inter Display', sans-serif">
    <text x="72" y="124" font-size="22" font-weight="600" letter-spacing="4" fill="#8fa3ff">HONEY SELECT 2 STUDIO PLUGIN</text>
    <text x="68" y="222" font-size="108" font-weight="800" letter-spacing="-2" fill="url(#title)">Camera Nav</text>
    <text x="72" y="276" font-size="30" font-weight="500" fill="#c7cff2">Move the Studio camera like you do in</text>
    <text x="72" y="316" font-size="30" font-weight="500" fill="#c7cff2"><tspan fill="#ffffff" font-weight="700">Unity</tspan> or <tspan fill="#ffffff" font-weight="700">Blender</tspan>.</text>

    <!-- feature chips -->
    <g font-size="20" font-weight="600">
      <rect x="72" y="352" width="196" height="44" rx="22" fill="#40c9ff" fill-opacity="0.14" stroke="#40c9ff" stroke-opacity="0.6"/>
      <text x="170" y="381" text-anchor="middle" fill="#bfeeff">Orbit · Pan · Zoom</text>
      <rect x="280" y="352" width="142" height="44" rx="22" fill="#b56bff" fill-opacity="0.14" stroke="#b56bff" stroke-opacity="0.6"/>
      <text x="351" y="381" text-anchor="middle" fill="#e6d2ff">WASD fly</text>
      <rect x="434" y="352" width="176" height="44" rx="22" fill="#5be38a" fill-opacity="0.12" stroke="#5be38a" stroke-opacity="0.55"/>
      <text x="522" y="381" text-anchor="middle" fill="#cdf7dc">Numpad views</text>
    </g>

    <!-- keycaps + mouse -->
    <g font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
      <rect x="134" y="440" width="56" height="56" rx="10" fill="url(#key)" stroke="#6f86ff" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="162" y="477">W</text>
      <rect x="72" y="504" width="56" height="56" rx="10" fill="url(#key)" stroke="#6f86ff" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="100" y="541">A</text>
      <rect x="134" y="504" width="56" height="56" rx="10" fill="url(#key)" stroke="#6f86ff" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="162" y="541">S</text>
      <rect x="196" y="504" width="56" height="56" rx="10" fill="url(#key)" stroke="#6f86ff" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="224" y="541">D</text>
    </g>
    <text x="270" y="533" font-size="30" font-weight="700" fill="#8fa3ff">+</text>
    <g transform="translate(320,470)">
      <rect x="0" y="0" width="58" height="90" rx="29" fill="url(#key)" stroke="#6f86ff" stroke-opacity="0.7" stroke-width="1.5"/>
      <path d="M29,0 V38" stroke="#6f86ff" stroke-opacity="0.7" stroke-width="1.5"/>
      <path d="M29,0 A29,29 0 0 1 58,29 V38 H29 Z" fill="#b56bff"/>
      <rect x="25" y="12" width="8" height="16" rx="4" fill="#d8e0ff"/>
    </g>
    <text x="402" y="508" font-size="22" font-weight="600" fill="#ffffff">Hold right mouse to fly</text>
    <text x="402" y="540" font-size="19" font-weight="500" fill="#9aa6d6">Shift+F8 cycles Vanilla › Unity › Blender</text>

    <text x="72" y="606" font-size="17" font-weight="500" fill="#6f7bb0">BepInEx 5 · StudioNEOV2 · MIT</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
