<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a38"/>
      <stop offset="1" stop-color="#1d1540"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="480" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b7cff" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#7a4dff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7a4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="0" y="340" width="1200" height="460" fill="url(#gridFade)"/>
    </mask>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40c9ff"/>
      <stop offset="1" stop-color="#b56bff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d4ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b56bff"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#40c9ff"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- perspective grid floor, vanishing point (600, 300) -->
  <g mask="url(#gridMask)" stroke="#6f86ff" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M600,300 L-300,800 M600,300 L-150,800 M600,300 L0,800 M600,300 L150,800 M600,300 L300,800 M600,300 L450,800 M600,300 L600,800 M600,300 L750,800 M600,300 L900,800 M600,300 L1050,800 M600,300 L1200,800 M600,300 L1350,800 M600,300 L1500,800"/>
    <path d="M0,372 H1200 M0,396 H1200 M0,428 H1200 M0,470 H1200 M0,528 H1200 M0,606 H1200 M0,712 H1200"/>
  </g>

  <!-- title -->
  <g font-family="Inter, 'Inter Display', sans-serif" text-anchor="middle">
    <text x="600" y="118" font-size="24" font-weight="600" letter-spacing="5" fill="#8fa3ff">HONEY SELECT 2 STUDIO PLUGIN</text>
    <text x="600" y="232" font-size="124" font-weight="800" letter-spacing="-2" fill="url(#title)">Camera Nav</text>
    <text x="600" y="292" font-size="36" font-weight="500" fill="#c7cff2">Move the camera like in <tspan fill="#ffffff" font-weight="700">Unity</tspan> or <tspan fill="#ffffff" font-weight="700">Blender</tspan></text>
  </g>

  <!-- orbit ring around the pivot -->
  <ellipse cx="600" cy="490" rx="300" ry="86" fill="none" stroke="url(#ring)" stroke-width="3.5" stroke-opacity="0.9"/>
  <path d="M330,452 A300,86 0 0 1 470,412" fill="none" stroke="#b56bff" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M870,528 A300,86 0 0 1 730,568" fill="none" stroke="#40c9ff" stroke-width="3.5" marker-end="url(#arrowC)"/>

  <!-- pivot gizmo -->
  <g stroke-linecap="round" stroke-width="6">
    <line x1="600" y1="490" x2="700" y2="516" stroke="#ff5a6e"/>
    <line x1="600" y1="490" x2="600" y2="372" stroke="#5be38a"/>
    <line x1="600" y1="490" x2="520" y2="532" stroke="#4d9bff"/>
  </g>
  <circle cx="700" cy="516" r="8" fill="#ff5a6e"/>
  <circle cx="600" cy="372" r="8" fill="#5be38a"/>
  <circle cx="520" cy="532" r="8" fill="#4d9bff"/>
  <circle cx="600" cy="490" r="13" fill="#ffffff"/>
  <circle cx="600" cy="490" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- camera on the ring, looking at the pivot -->
  <path d="M762,414 L616,474 L618,500 L784,444 Z" fill="#40c9ff" fill-opacity="0.08"/>
  <g stroke="#40c9ff" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="7 7" fill="none">
    <line x1="762" y1="414" x2="616" y2="474"/>
    <line x1="784" y1="444" x2="618" y2="500"/>
  </g>
  <g transform="translate(822,410) rotate(-22)">
    <rect x="-40" y="-28" width="80" height="56" rx="12" fill="#ffffff"/>
    <rect x="-64" y="-16" width="28" height="32" rx="5" fill="#d8e0ff"/>
    <circle cx="7" cy="0" r="16" fill="#1a2145"/>
    <circle cx="7" cy="0" r="8" fill="#40c9ff"/>
    <rect x="14" y="-40" width="18" height="12" rx="3" fill="#ffffff"/>
  </g>

  <!-- feature chips (kept right of the tag overlay in the bottom-left corner) -->
  <g font-family="Inter, 'Inter Display', sans-serif" font-size="24" font-weight="600" text-anchor="middle">
    <rect x="290" y="636" width="226" height="52" rx="26" fill="#40c9ff" fill-opacity="0.14" stroke="#40c9ff" stroke-opacity="0.6"/>
    <text x="403" y="670" fill="#bfeeff">Orbit · Pan · Zoom</text>
    <rect x="532" y="636" width="164" height="52" rx="26" fill="#b56bff" fill-opacity="0.14" stroke="#b56bff" stroke-opacity="0.6"/>
    <text x="614" y="670" fill="#e6d2ff">WASD fly</text>
    <rect x="712" y="636" width="198" height="52" rx="26" fill="#5be38a" fill-opacity="0.12" stroke="#5be38a" stroke-opacity="0.55"/>
    <text x="811" y="670" fill="#cdf7dc">Numpad views</text>
  </g>
  <text x="600" y="732" font-family="Inter, 'Inter Display', sans-serif" font-size="21" font-weight="500" text-anchor="middle" fill="#9aa6d6">Shift+F8 cycles Vanilla › Unity › Blender</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
